# RED LOOP — bulutta WebGL build + GitHub Pages yayını
#
# Bilgisayarına Unity editörü kurmadan oyunu derleyip tarayıcıda oynamak için.
# Gerekli GitHub secret'ları (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   -> Unity_lic.ulf dosyasının içeriği
#   UNITY_EMAIL     -> Unity hesabının e-postası
#   UNITY_PASSWORD  -> Unity hesabının şifresi
#
# - Her push'ta build alınır (derleme hatası varsa burada görünür).
# - Sadece main dalındaki build GitHub Pages'e yayınlanır.
# - Actions sekmesinden "Run workflow" ile elle de başlatılabilir.

name: WebGL Build

on:
  push:
    branches: [main, story-sound-ending]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unity WebGL build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Disk alanı aç (proje büyük)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Library önbelleği
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Unity ile derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: RedLoop

      - name: Build'i sakla
        uses: actions/upload-artifact@v4
        with:
          name: RedLoop-WebGL
          path: build/WebGL/RedLoop

      - name: Pages paketi hazırla
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/RedLoop

  deploy:
    name: GitHub Pages'e yayınla
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
